<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting</title>
    <meta name="description"
      content="Have questions about our rafting trips? Reach out to the Whitewater Rafting team in Minnesota.">
    <meta name="author" content="Humphrey Darko">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg" alt="Whitewater Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-header">
            <h1>Contact Whitewater Rafting</h1>
            <div class="contact-grid">
                <div class="info-details">
                    <p><strong>Address:</strong> 123 Rapids Lane, Minneapolis, MN 55401</p>
                    <p><strong>Phone:</strong> (612) 555-0199</p>
                    <p><strong>Email:</strong> paddle@wwradventures.com</p>
                </div>
                <div class="map-container">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2822.42831518063!2d-93.2650106!3d44.977753!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x52b3329a733303b3%3A0x2a98c89a77c387!2sMinneapolis%2C%20MN!5e0!3m2!1sen!2sus!4v1712250000000"
                      width="600" height="450" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </section>

        <section class="team-section">
            <h2>Meet Our Adventure Experts</h2>
            <div class="team-grid">
                <figure>
                    <img src="images/profile.png" alt="Head of Operations">
                    <figcaption>Alex Thompson - Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/profile.png" alt="Safety Lead">
                    <figcaption>Jordan Smith - Safety Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/profile.png" alt="Booking Specialist">
                    <figcaption>Casey Rivers - Guest Relations</figcaption>
                </figure>
            </div>
        </section>

        <section class="form-section">
            <h2>Send a Message</h2>
            <form action="#">
                <div class="form-control">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-control">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>What can we help you with?</legend>
                    <label><input type="radio" id="general" name="purpose" value="general" checked>
                        General
                        Inquiry</label>
                    <label><input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation
                        Question</label>
                    <label><input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website
                        Suggestion</label>
                </fieldset>

                <div class="form-control">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Submit Request</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Whitewater Rafting | Humphrey Darko | Minnesota, USA</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.png"
                  alt="Facebook"></a>
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.png"
                  alt="Twitter"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.png"
                  alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
